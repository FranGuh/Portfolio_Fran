<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-route <title>, description, robots, canonical and Open Graph / Twitter
      tags are emitted statically at build time by vite-react-ssg from each
      page's <SEOHead> (see src/components/SEOHead.tsx). They are intentionally
      NOT declared here: vite-react-ssg appends (does not replace) head tags,
      so a static <title>/<link canonical> here would duplicate and conflict
      with the per-route ones. Only truly route-invariant tags live here.
    -->
    <link rel="icon" type="image/svg+xml" href="/Plynte.svg" />

    <!--
      The site-wide JSON-LD knowledge @graph is generated from src/data/cvData.ts
      and injected here at build time by the `portfolio-structured-data` Vite
      plugin (see vite.config.ts), so it always covers every project/experience
      and can never drift. Do not hand-write structured data in this file.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
